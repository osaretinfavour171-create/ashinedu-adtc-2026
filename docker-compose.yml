version: "3.8"

services:
  docreader:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./tools/docreader", "-addr", "0.0.0.0:8765", "-data", "./app/data"]
    ports:
      - "8765:8765"
    volumes:
      - ./app/data:/app/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

